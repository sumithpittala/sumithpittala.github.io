<head>

    <title>sumith_pittala | Terminal</title>

    <style>
        :root {
            --bg-color: #030305;
            --terminal-bg: rgba(10, 12, 18, 0.75);
            --text-color: #c9d1d9;
            --prompt-color: #58a6ff;
            --accent-color: #7ee787;
            --header-color: #ff7b72;
            --border-color: #21262d;
            --header-bg: rgba(33, 38, 45, 0.9);
            --overlay-bg: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(3,3,5,0.7) 100%);
        }

        [data-theme="light"] {
            --bg-color: #dbdee3;
            --terminal-bg: rgba(255, 255, 255, 0.8);
            --text-color: #24292f;
            --prompt-color: #0969da;
            --accent-color: #1a7f37;
            --header-color: #cf222e;
            --border-color: #d0d7de;
            --header-bg: rgba(246, 248, 250, 0.95);
            --overlay-bg: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(219,222,227,0.5) 100%);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Fira Code', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            position: relative;
            transition: background-color 0.5s ease-in-out;
        }

        /* --- DUAL VIDEO BACKGROUNDS --- */
        .video-bg-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .video-bg-container video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity 0.6s ease-in-out;
        }

        /* Initial Opacities */
        #video-dark { opacity: 1; }
        #video-light { opacity: 0; }

        /* Cross-fade handling via data attribute */
        [data-theme="light"] #video-dark { opacity: 0; }
        [data-theme="light"] #video-light { opacity: 1; }

        .video-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-bg);
            z-index: 2;
            transition: background 0.6s ease-in-out;
        }

        /* --- TOGGLE BUTTON --- */
        .theme-toggle {
            position: absolute;
            top: 20px; left: 20px;
            cursor: pointer;
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            padding: 10px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }
        .theme-toggle:hover { transform: scale(1.1); }
